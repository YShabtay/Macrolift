<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="כושר ותזונה אישית, בנוי בשבילך" />

    <!-- Open Graph / Twitter Card - rich link previews on LinkedIn, WhatsApp, etc.
         og:image/twitter:image use a root-relative path; once deployed, replace it with the
         full absolute URL (e.g. https://your-domain.app/icons/icon-512.png) - some crawlers
         (WhatsApp in particular) only render a preview image when given an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MacroLift | מערכת חכמה למעקב כושר, תזונה וחיטוב" />
    <meta
      property="og:description"
      content="אפליקציית PWA מתקדמת (Local-First) עם מנוע חישוב דטרמיניסטי, ניתוח התקדמות ויזואלי ומעקב אימונים."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MacroLift | מערכת חכמה למעקב כושר, תזונה וחיטוב" />
    <meta
      name="twitter:description"
      content="אפליקציית PWA מתקדמת (Local-First) עם מנוע חישוב דטרמיניסטי, ניתוח התקדמות ויזואלי ומעקב אימונים."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- iOS "Add to Home Screen" support (Apple ignores the web app manifest for most of this) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MacroLift" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MacroLift | כושר ותזונה אישית</title>
    <script>
      // Last line of defence: if the app fails before React can mount (a script that won't load or parse, an error while
      // the modules evaluate), #root stays empty and the page is white. This shows a plain recovery screen instead.
      (function () {
        var lastError = '';
        function note(e) {
          var err = e && (e.error || e.reason || e);
          lastError = (err && err.message) || (e && e.message) || String(err || 'script failed to load');
          if (e && e.target && e.target.src) lastError = 'Failed to load ' + e.target.src;
        }
        window.addEventListener('error', note, true);
        window.addEventListener('unhandledrejection', note);

        function cleanup(thenReload, wipe) {
          if (wipe) {
            try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
          }
          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) {}
          Promise.all(jobs).then(thenReload, thenReload);
        }

        function show() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var box = document.createElement('div');
          box.setAttribute('dir', 'rtl');
          box.style.cssText = 'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#09090b;color:#fafafa;font-family:Assistant,system-ui,sans-serif';
          function add(tag, text, css) {
            var el = document.createElement(tag);
            el.textContent = text;
            el.style.cssText = css || '';
            box.appendChild(el);
            return el;
          }
          function button(text, css, onclick) {
            var b = add('button', text, 'width:100%;max-width:280px;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:0;' + css);
            b.onclick = onclick;
          }
          add('h1', 'האפליקציה לא עלתה', 'font-size:20px;margin:0');
          add('p', 'קרתה תקלה בטעינה. נסו לרענן; אם זה חוזר, איפוס הנתונים המקומיים יחזיר את האפליקציה לעבוד (ומוחק את המידע במכשיר).', 'max-width:320px;margin:0;font-size:14px;line-height:1.6;color:#a1a1aa');
          button('רענן אפליקציה 🔄', 'background:#a3e635;color:#09090b', function () { cleanup(function () { location.reload(); }, false); });
          button('איפוס נתונים מקומיים ⚠️', 'background:transparent;color:#f87171;border:1px solid #f8717166', function () {
            if (confirm('פעולה זו תמחק את כל הנתונים השמורים במכשיר הזה ולא ניתן לשחזר אותם, אלא אם יש לכם קובץ גיבוי. להמשיך?')) cleanup(function () { location.reload(); }, true);
          });
          add('p', lastError || 'unknown error', 'direction:ltr;max-width:340px;margin:0;font-size:11px;color:#f87171;word-break:break-word');
          root.appendChild(box);
        }

        window.addEventListener('load', function () { setTimeout(show, 6000); });
        window.addEventListener('error', function () { setTimeout(show, 2500); }, true);
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          // matchMedia/localStorage unavailable - default to light, matching Tailwind's unprefixed base.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
